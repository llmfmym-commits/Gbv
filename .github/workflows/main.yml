name: Build APK from ZIP

# Put your project .zip in the ROOT of the repository, then put this file at:
#   .github/workflows/build-apk.yml
# The workflow extracts the zip, builds it, and uploads a signed APK as an artifact.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (leave empty to keep the value inside the zip)'
        required: false
        default: ''
      app_id:
        description: 'Package name, e.g. com.example.myapp (leave empty to keep)'
        required: false
        default: ''
      version_name:
        description: 'Version name, e.g. 1.0.0 (leave empty to keep)'
        required: false
        default: ''
      version_code:
        description: 'Version code, e.g. 1 (leave empty to keep)'
        required: false
        default: ''
      source_type:
        description: 'URL or HTML (leave empty to keep)'
        required: false
        default: ''
      app_url:
        description: 'Website URL (leave empty to keep)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in the repository root. Upload your project zip first."
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

          # Find the folder that contains gradlew (works even if the zip has a top-level folder)
          GRADLEW=$(find extracted -type f -name gradlew | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found inside the zip. Is this an Android Gradle project?"
            exit 1
          fi
          PROJECT_DIR=$(realpath "$(dirname "$GRADLEW")")
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply optional config inputs
        env:
          IN_NAME: ${{ github.event.inputs.app_name }}
          IN_ID: ${{ github.event.inputs.app_id }}
          IN_VNAME: ${{ github.event.inputs.version_name }}
          IN_VCODE: ${{ github.event.inputs.version_code }}
          IN_SOURCE: ${{ github.event.inputs.source_type }}
          IN_URL: ${{ github.event.inputs.app_url }}
        run: |
          python3 - <<'PY'
          import json, os

          d = os.environ["PROJECT_DIR"]
          root_cfg = os.path.join(d, "app-config.json")
          assets_cfg = os.path.join(d, "app", "src", "main", "assets", "app-config.json")

          data = {}
          for p in (root_cfg, assets_cfg):
              if os.path.exists(p):
                  with open(p, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  break

          changes = {
              "appName": os.environ.get("IN_NAME", ""),
              "appId": os.environ.get("IN_ID", ""),
              "versionName": os.environ.get("IN_VNAME", ""),
              "sourceType": os.environ.get("IN_SOURCE", ""),
              "url": os.environ.get("IN_URL", ""),
          }
          for k, v in changes.items():
              if v.strip():
                  data[k] = v.strip()
          vc = os.environ.get("IN_VCODE", "").strip()
          if vc.isdigit():
              data["versionCode"] = int(vc)

          for p in (root_cfg, assets_cfg):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
          print("Config in use:", json.dumps(data, ensure_ascii=False))
          PY

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$PROJECT_DIR/release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            [ -n "$SECRET_STORE_PASSWORD" ] && echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            [ -n "$SECRET_KEY_ALIAS" ]      && echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            [ -n "$SECRET_KEY_PASSWORD" ]   && echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found. Generating a temporary keystore so the APK is signed and installable."
            keytool -genkeypair -v -keystore "$KS" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android, O=Android, C=US"
            # The project's Gradle file also looks for debug.keystore; give it the same one.
            cp "$KS" "$PROJECT_DIR/debug.keystore"
          fi

          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p output_apk
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No signed APK was produced. Check the Gradle step above."
            find "$PROJECT_DIR/app/build/outputs" -type f | head -n 50
            exit 1
          fi
          echo "Found: $APK_FILE"
          cp "$APK_FILE" output_apk/app-release.apk
          ls -lh output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output_apk/app-release.apk
          retention-days: 30

